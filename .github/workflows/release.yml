name: Release

# Push a tag like v0.1.0 to build Release and publish it as a GitHub
# release with a zip attached.
on:
  push:
    tags: ['v*']

permissions:
  contents: write   # create the release and upload its asset

env:
  TOOLSET: v143     # see ci.yml

jobs:
  build:
    name: build ${{ matrix.platform }}
    runs-on: windows-2022
    timeout-minutes: 60
    strategy:
      matrix:
        include:
          - platform: x64
            label: win-x64
          - platform: Win32
            label: win-x86

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ./.github/actions/build
        with:
          platform: ${{ matrix.platform }}
          configuration: Release
          toolset: ${{ env.TOOLSET }}

      - name: Run tests
        shell: pwsh
        run: ./${{ matrix.platform }}/Release/VoIPModem.Tests.exe

      # The binary links libv90modem (GPL-2.0-only) and PJSIP (GPL-2.0 or
      # later), so their licence texts ship with it.
      - name: Package
        shell: pwsh
        run: |
          $name = "VoIPModem-${{ github.ref_name }}-${{ matrix.label }}"
          $dir = "dist/$name"
          New-Item -ItemType Directory -Force "$dir/licenses" | Out-Null
          Copy-Item ${{ matrix.platform }}/Release/VoIPModem.exe $dir
          Copy-Item config/voipmodem.ini.sample $dir
          Copy-Item README.md $dir
          Copy-Item third_party/libv90modem/LICENSE "$dir/licenses/libv90modem-LICENSE.txt"
          Copy-Item third_party/pjproject/COPYING "$dir/licenses/pjproject-COPYING.txt"
          Compress-Archive -Path "$dir/*" -DestinationPath "dist/$name.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.label }}
          path: dist/*.zip
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}" dist/*.zip
          --repo "${{ github.repository }}"
          --title "VoIPModem ${{ github.ref_name }}"
          --generate-notes
          --verify-tag
