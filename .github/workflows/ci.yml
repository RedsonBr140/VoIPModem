name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or PR supersedes a run still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # windows-2022 ships Visual Studio 2022, whose toolset is v143. Pinned
  # (not windows-latest) because the toolset below must match the image.
  TOOLSET: v143

jobs:
  build-and-test:
    name: ${{ matrix.platform }} ${{ matrix.configuration }}
    runs-on: windows-2022
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, Win32]
        configuration: [Debug, Release]

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: ./.github/actions/build
        with:
          platform: ${{ matrix.platform }}
          configuration: ${{ matrix.configuration }}
          toolset: ${{ env.TOOLSET }}

      # Exits non-zero if any test fails. No COM ports, SIP server or network
      # needed: the suite covers the Hayes parser, the state machine, config
      # loading and two libv90modem instances connected back to back.
      - name: Run tests
        shell: pwsh
        run: ./${{ matrix.platform }}/${{ matrix.configuration }}/VoIPModem.Tests.exe

      - name: Upload binaries
        if: matrix.configuration == 'Release'
        uses: actions/upload-artifact@v7
        with:
          name: VoIPModem-${{ matrix.platform }}-Release-${{ github.sha }}
          path: |
            ${{ matrix.platform }}/Release/VoIPModem.exe
            ${{ matrix.platform }}/Release/VoIPModemManager.exe
            config/voipmodem.ini.sample
          if-no-files-found: error
          retention-days: 14

  # Linux: the library and the unit tests through CMake (docs/LINUX.md).
  # No Linux executable yet.
  linux:
    name: Linux ${{ matrix.configuration }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]

    steps:
      # Only the submodules the Linux build uses (not pjproject-xp).
      - uses: actions/checkout@v7
      - name: Check out submodules
        run: git submodule update --init --depth 1 third_party/pjproject third_party/libv90modem

      - name: Configure
        run: cmake -S . -B build-linux -DCMAKE_BUILD_TYPE=${{ matrix.configuration }}

      - name: Build
        run: cmake --build build-linux -j "$(nproc)"

      - name: Run tests
        run: ctest --test-dir build-linux --output-on-failure
